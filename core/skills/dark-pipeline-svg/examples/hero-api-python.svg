freeze"/></rect></clipPath><g clip-path="url(#ty3)"><text x="872" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#e6edf3" xml:space="preserve" style="white-space:pre">    city = <tspan fill="#3776ab">await</tspan> repo.find(id)</text></g><text x="848" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#4b5563">4</text><clipPath id="ty4"><rect x="872" y="150" width="0" height="19.200000000000003"><animate attributeName="width" to="148" begin="3.85s" dur="0.6s" fill="freeze"/></rect></clipPath><g clip-path="url(#ty4)"><text x="872" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#e6edf3" xml:space="preserve" style="white-space:pre">    <tspan fill="#3776ab">if</tspan> city <tspan fill="#3776ab">is None</tspan>:</text></g><text x="848" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#4b5563">5</text><clipPath id="ty5"><rect x="872" y="170" width="0" height="19.200000000000003"><animate attributeName="width" to="234.4" begin="4.55s" dur="0.96s" fill="freeze"/></rect></clipPath><g clip-path="url(#ty5)"><text x="872" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#e6edf3" xml:space="preserve" style="white-space:pre">        <tspan fill="#3776ab">raise</tspan> HTTPException(<tspan fill="#f59e0b">404</tspan>)</text></g><text x="848" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#4b5563">6</text><clipPath id="ty6"><rect x="872" y="190" width="0" height="19.200000000000003"><animate attributeName="width" to="112" begin="5.61s" dur="0.45s" fill="freeze"/></rect></clipPath><g clip-path="url(#ty6)"><text x="872" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#e6edf3" xml:space="preserve" style="white-space:pre">    <tspan fill="#3776ab">return</tspan> city</text></g><rect x="872" y="210" width="7" height="14" fill="#ffd43b" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="6.16s" dur="1s" repeatCount="indefinite"/></rect></g>
