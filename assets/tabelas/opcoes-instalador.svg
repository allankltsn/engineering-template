<text x="198" y="212" xml:space="preserve"><tspan fill="#c9d4e3">Para </tspan><tspan fill="#c9d4e3">qual </tspan><tspan fill="#c9d4e3">ferramenta </tspan><tspan fill="#c9d4e3">de </tspan><tspan fill="#c9d4e3">IA </tspan><tspan fill="#c9d4e3">instalar: </tspan><tspan fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">claude</tspan><tspan fill="#c9d4e3">, </tspan><tspan fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">codex</tspan><tspan fill="#c9d4e3"> ou </tspan><tspan fill="#c9d4e3">ambas. </tspan><tspan fill="#c9d4e3">Padrão: </tspan><tspan fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">claude,codex</tspan><tspan fill="#c9d4e3">. </tspan><tspan fill="#c9d4e3">Numa </tspan></text>
