<text x="198" y="156" xml:space="preserve"><tspan fill="#c9d4e3">Quais </tspan><tspan fill="#c9d4e3">perfis </tspan><tspan fill="#c9d4e3">instalar </tspan><tspan fill="#c9d4e3">(veja </tspan><tspan fill="#c9d4e3">Perfis). </tspan><tspan fill="#c9d4e3">Padrão: </tspan><tspan fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">base,product-team,github-projects</tspan><tspan fill="#c9d4e3">. </tspan><tspan fill="#c9d4e3">Numa </tspan></text>
<text x="198" y="175" xml:space="preserve"><tspan fill="#c9d4e3">atualização, </tspan><tspan fill="#c9d4e3">mantém </tspan><tspan fill="#c9d4e3">os </tspan><tspan fill="#c9d4e3">perfis </tspan><tspan fill="#c9d4e3">já </tspan><tspan fill="#c9d4e3">instalados.</tspan></text>
