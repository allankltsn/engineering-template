<text x="198" y="268" xml:space="preserve"><tspan fill="#c9d4e3">Troca </tspan><tspan fill="#c9d4e3">o </tspan><tspan fill="#c9d4e3">"tamanho" </tspan><tspan fill="#c9d4e3">do </tspan><tspan fill="#c9d4e3">modelo </tspan><tspan fill="#c9d4e3">de </tspan><tspan fill="#c9d4e3">um </tspan><tspan fill="#c9d4e3">especialista </tspan><tspan fill="#c9d4e3">neste </tspan><tspan fill="#c9d4e3">projeto, </tspan><tspan fill="#c9d4e3">por </tspan><tspan fill="#c9d4e3">exemplo </tspan><tspan fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">--tier </tspan><tspan fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">reviewer=deep</tspan><tspan fill="#c9d4e3">. </tspan></text>
<text x="198" y="287" xml:space="preserve"><tspan fill="#c9d4e3">Pode </tspan><tspan fill="#c9d4e3">repetir. </tspan><tspan fill="#c9d4e3">Ver </tspan><tspan fill="#c9d4e3">Escolha </tspan><tspan fill="#c9d4e3">de </tspan><tspan fill="#c9d4e3">especialistas </tspan><tspan fill="#c9d4e3">e </tspan><tspan fill="#c9d4e3">de </tspan><tspan fill="#c9d4e3">modelo.</tspan></text>
