<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 455" width="920" height="455" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" role="img" aria-label="Etapa 01 · Instalação: 7 linhas, colunas Passo, Como é de verdade">
