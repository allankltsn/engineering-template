<text x="16" y="100" xml:space="preserve"><tspan fill="#c9d4e3">Pré-requisito</tspan></text>
<text x="213" y="100" xml:space="preserve"><tspan fill="#c9d4e3">Python </tspan><tspan fill="#c9d4e3">3.11+. </tspan><tspan fill="#c9d4e3">Nenhuma </tspan><tspan fill="#c9d4e3">outra </tspan><tspan fill="#c9d4e3">dependência.</tspan></text>
<line x1="16" y1="113" x2="904" y2="113" stroke="#1f2937"/>
<rect x="1" y="113" width="918" height="56" fill="#0f1623"/>
<text x="16" y="137" xml:space="preserve"><tspan fill="#c9d4e3">Instalar</tspan></text>
<text x="213" y="137" xml:space="preserve"><tspan fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">python </tspan><tspan fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">install.py </tspan><tspan fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">&lt;projeto&gt;</tspan><tspan fill="#c9d4e3"> (atalho </tspan><tspan fill="#c9d4e3">com </tspan><tspan fill="#c9d4e3">padrões) </tspan><tspan fill="#c9d4e3">ou </tspan><tspan fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">python </tspan><tspan fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">scripts/template.py </tspan><tspan fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">init </tspan></text>
<text x="213" y="156" xml:space="preserve"><tspan fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">--target </tspan><tspan fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">&lt;pasta&gt;</tspan><tspan fill="#c9d4e3">. </tspan><tspan fill="#c9d4e3">Sempre </tspan><tspan fill="#c9d4e3">rode </tspan><tspan fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">--dry-run</tspan><tspan fill="#c9d4e3"> antes.</tspan></text>
<line x1="16" y1="169" x2="904" y2="169" stroke="#1f2937"/>
<text x="16" y="193" xml:space="preserve"><tspan fill="#c9d4e3">Padrões </tspan><tspan fill="#c9d4e3">do </tspan><tspan fill="#c9d4e3">instalador</tspan></text>
<text x="213" y="193" xml:space="preserve"><tspan fill="#c9d4e3">Perfis </tspan><tspan fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">base,product-team,github-projects</tspan><tspan fill="#c9d4e3">; </tspan><tspan fill="#c9d4e3">provedores </tspan><tspan fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">claude,codex</tspan><tspan fill="#c9d4e3">. </tspan><tspan fill="#c9d4e3">Em </tspan><tspan fill="#c9d4e3">atualização </tspan><tspan fill="#c9d4e3">mantém </tspan><tspan fill="#c9d4e3">o </tspan></text>
<text x="213" y="212" xml:space="preserve"><tspan fill="#c9d4e3">que </tspan><tspan fill="#c9d4e3">já </tspan><tspan fill="#c9d4e3">estava </tspan><tspan fill="#c9d4e3">instalado.</tspan></text>
<line x1="16" y1="225" x2="904" y2="225" stroke="#1f2937"/>
<rect x="1" y="225" width="918" height="75" fill="#0f1623"/>
<text x="16" y="249" xml:space="preserve"><tspan fill="#c9d4e3">O </tspan><tspan fill="#c9d4e3">que </tspan><tspan fill="#c9d4e3">grava</tspan></text>
<text x="213" y="249" xml:space="preserve"><tspan fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">.engineering/</tspan><tspan fill="#c9d4e3"> (conhecimento </tspan><tspan fill="#c9d4e3">+ </tspan><tspan fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">project.json</tspan><tspan fill="#c9d4e3"> + </tspan><tspan fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">manifest.json</tspan><tspan fill="#c9d4e3"> com </tspan><tspan fill="#c9d4e3">impressão </tspan><tspan fill="#c9d4e3">digital </tspan><tspan fill="#c9d4e3">de </tspan><tspan fill="#c9d4e3">cada </tspan></text>
<text x="213" y="268" xml:space="preserve"><tspan fill="#c9d4e3">arquivo), </tspan><tspan fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">CLAUDE.md</tspan><tspan fill="#c9d4e3">, </tspan><tspan fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">AGENTS.md</tspan><tspan fill="#c9d4e3">, </tspan><tspan fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">.claude/</tspan><tspan fill="#c9d4e3"> (agents, </tspan><tspan fill="#c9d4e3">commands, </tspan><tspan fill="#c9d4e3">skills), </tspan><tspan fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">.codex/agents</tspan><tspan fill="#c9d4e3">, </tspan></text>
<text x="213" y="287" xml:space="preserve"><tspan fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">.agents/skills</tspan><tspan fill="#c9d4e3">.</tspan></text>
<line x1="16" y1="300" x2="904" y2="300" stroke="#1f2937"/>
<text x="16" y="324" xml:space="preserve"><tspan fill="#c9d4e3">Atualizar</tspan></text>
<text x="213" y="324" xml:space="preserve"><tspan fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">sync</tspan><tspan fill="#c9d4e3"> refaz </tspan><tspan fill="#c9d4e3">a </tspan><tspan fill="#c9d4e3">instalação; </tspan><tspan fill="#c9d4e3">se </tspan><tspan fill="#c9d4e3">você </tspan><tspan fill="#c9d4e3">editou </tspan><tspan fill="#c9d4e3">um </tspan><tspan fill="#c9d4e3">arquivo </tspan><tspan fill="#c9d4e3">gerenciado, </tspan><tspan fill="#c9d4e3">avisa </tspan><tspan fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">installed </tspan><tspan fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">drift</tspan><tspan fill="#c9d4e3"> em </tspan><tspan fill="#c9d4e3">vez </tspan><tspan fill="#c9d4e3">de </tspan></text>
<text x="213" y="343" xml:space="preserve"><tspan fill="#c9d4e3">sobrescrever.</tspan></text>
<line x1="16" y1="356" x2="904" y2="356" stroke="#1f2937"/>
<rect x="1" y="356" width="918" height="37" fill="#0f1623"/>
<text x="16" y="380" xml:space="preserve"><tspan fill="#c9d4e3">Conferir</tspan></text>
<text x="213" y="380" xml:space="preserve"><tspan fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">check</tspan><tspan fill="#c9d4e3"> valida </tspan><tspan fill="#c9d4e3">o </tspan><tspan fill="#c9d4e3">template; </tspan><tspan fill="#c9d4e3">com </tspan><tspan fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">--target</tspan><tspan fill="#c9d4e3">, </tspan><tspan fill="#c9d4e3">valida </tspan><tspan fill="#c9d4e3">o </tspan><tspan fill="#c9d4e3">projeto </tspan><tspan fill="#c9d4e3">instalado.</tspan></text>
<line x1="16" y1="393" x2="904" y2="393" stroke="#1f2937"/>
<text x="16" y="417" xml:space="preserve"><tspan fill="#c9d4e3">Segurança</tspan></text>
<text x="213" y="417" xml:space="preserve"><tspan fill="#c9d4e3">Nada </tspan><tspan fill="#c9d4e3">é </tspan><tspan fill="#c9d4e3">instalado </tspan><tspan fill="#c9d4e3">no </tspan><tspan fill="#c9d4e3">computador </tspan><tspan fill="#c9d4e3">nem </tspan><tspan fill="#c9d4e3">em </tspan><tspan fill="#c9d4e3">configuração </tspan><tspan fill="#c9d4e3">global; </tspan><tspan fill="#c9d4e3">conflito </tspan><tspan fill="#c9d4e3">de </tspan><tspan fill="#c9d4e3">arquivo </tspan><tspan fill="#c9d4e3">aborta </tspan><tspan fill="#e6edf3" font-weight="700">sem </tspan><tspan fill="#e6edf3" font-weight="700">gravar </tspan></text>
<text x="213" y="436" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">nada </tspan><tspan fill="#e6edf3" font-weight="700">pela </tspan><tspan fill="#e6edf3" font-weight="700">metade</tspan><tspan fill="#c9d4e3">.</tspan></text>
</svg>
