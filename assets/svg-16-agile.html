  <!-- ══ GIT WORKTREE + POLYREPO ══ -->
  <g opacity="0"><animate attributeName="opacity" to="1" begin="0.6s" dur="0.4s" fill="freeze"/>
    <rect x="920" y="82" width="860" height="270" rx="8" fill="#0d1117" stroke="#2dd4bf" stroke-width="1"/>
    <text x="1350" y="102" font-size="10" fill="#2dd4bf" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">GIT WORKTREE + ESTRUTURA POLYREPO</text>

    <!-- Worktree commands -->
    <text x="938" y="120" font-size="9" fill="#4b5563" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">CRIAR:</text>
    <rect x="990" y="108" width="770" height="18" rx="3" fill="#060c14"/>
    <text x="998" y="121" font-size="9" fill="#2dd4bf" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">git worktree add ../worktrees/agent-S-042 -b feat/agent-S-042</text>

    <text x="938" y="146" font-size="9" fill="#4b5563" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">LISTAR:</text>
    <rect x="990" y="134" width="770" height="18" rx="3" fill="#060c14"/>
    <text x="998" y="147" font-size="9" fill="#4ade80" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">git worktree list</text>

    <text x="938" y="172" font-size="9" fill="#4b5563" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">REMOVER:</text>
    <rect x="990" y="160" width="770" height="18" rx="3" fill="#060c14"/>
    <text x="998" y="173" font-size="9" fill="#ef4444" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">git worktree remove ../worktrees/agent-S-042 --force</text>

    <!-- Estrutura de diretórios -->
    <text x="938" y="198" font-size="9.5" fill="#8b96a8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">ESTRUTURA DE PASTAS (polyrepo):</text>
    <rect x="930" y="204" width="460" height="134" rx="4" fill="#060c14" stroke="#1f2937" stroke-width="1"/>
    <text x="944" y="222" font-size="8.5" fill="#4ade80" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">~/projects/</text>
    <text x="944" y="238" font-size="8.5" fill="#8b96a8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">  ├── my-app/            ← repo principal (main)</text>
    <text x="944" y="254" font-size="8.5" fill="#8b96a8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">  ├── worktrees/</text>
    <text x="944" y="270" font-size="8.5" fill="#2dd4bf" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">  │   ├── agent-S-042/   ← feat/agent-S-042</text>

    <text x="944" y="302" font-size="8.5" fill="#f472b6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">  │   └── agent-S-044/   ← feat/agent-S-044</text>
    <text x="944" y="318" font-size="8.5" fill="#8b96a8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">  └── diário/ live-state.md</text>

    <rect x="1404" y="204" width="366" height="134" rx="4" fill="#0d1a1a" stroke="#2dd4bf" stroke-width="1"/>
    <text x="1420" y="222" font-size="9.5" fill="#2dd4bf" font-weight="700">VANTAGENS DO WORKTREE</text>
    <text x="1420" y="240" font-size="8.5" fill="#8b96a8">· Sem stash entre agents</text>
    <text x="1420" y="256" font-size="8.5" fill="#8b96a8">· Isolamento total de branches</text>
    <text x="1420" y="272" font-size="8.5" fill="#8b96a8">· Paralelo real (2+ agentes)</text>
    <text x="1420" y="288" font-size="8.5" fill="#8b96a8">· Contexto de diretório isolado</text>
    <text x="1420" y="304" font-size="8.5" fill="#8b96a8">· .env por worktree (opcional)</text>
    <text x="1420" y="320" font-size="8.5" fill="#2dd4bf">· Crash não afeta outros agents</text>

  <!-- ══ CONVENTIONAL COMMITS ══ -->
  <g opacity="0"><animate attributeName="opacity" to="1" begin="0.8s" dur="0.4s" fill="freeze"/>
    <rect x="20" y="368" width="740" height="290" rx="8" fill="#0d1117" stroke="#3b82f6" stroke-width="1"/>
    <text x="38" y="388" font-size="10" fill="#3b82f6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="1">CONVENTIONAL COMMITS — PADRÃO OBRIGATÓRIO</text>

    <text x="38" y="466" font-size="8.5" fill="#8b96a8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">refactor(db): extract query helpers — S-044</text>
    <text x="38" y="482" font-size="8.5" fill="#a78bfa" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">test(users): add integration tests — S-042</text>
    <text x="38" y="498" font-size="8.5" fill="#f59e0b" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">chore(ci): add cache for node_modules — S-045</text>
    <text x="38" y="514" font-size="8.5" fill="#2dd4bf" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">docs(api): update OpenAPI spec — S-046</text>

    <text x="38" y="600" font-size="8.5" fill="#4b5563" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">test      adiciona/melhora testes             não</text>
    <text x="38" y="616" font-size="8.5" fill="#4b5563" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">chore     manutenção, deps, CI                não</text>
    <text x="38" y="632" font-size="8.5" fill="#a78bfa" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">BREAKING  ! após tipo: breaking change        major (x.0.0)</text>
    <text x="38" y="650" font-size="8" fill="#3b82f6">Changelog gerado automaticamente em releases semânticos</text>
  </g>

  <!-- ══ KANBAN ══ -->
  <g opacity="0"><animate attributeName="opacity" to="1" begin="1s" dur="0.4s" fill="freeze"/>
    <rect x="770" y="368" width="1010" height="290" rx="8" fill="#0d1117" stroke="#f59e0b" stroke-width="1"/>
    <text x="788" y="388" font-size="10" fill="#f59e0b" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="1">KANBAN × SCRUM — QUANDO USAR CADA UM</text>
    <line x1="780" y1="394" x2="1770" y2="394" stroke="#1f2937" stroke-width="1"/>

    <!-- Scrum column -->
    <rect x="782" y="402" width="468" height="240" rx="6" fill="#0d1a2e" stroke="#3b82f6" stroke-width="1"/>
    <text x="1016" y="422" font-size="9.5" fill="#3b82f6" font-weight="700" text-anchor="middle">SCRUM (padrão)</text>
    <text x="790" y="440" font-size="9" fill="#8b96a8">· Sprints de 2 semanas com escopo fixo</text>
    <text x="790" y="456" font-size="9" fill="#8b96a8">· Backlog refinado antes de cada sprint</text>
    <text x="790" y="472" font-size="9" fill="#8b96a8">· Velocity tracking para previsibilidade</text>
    <text x="790" y="488" font-size="9" fill="#8b96a8">· Planning + Review + Retro obrigatórios</text>
    <text x="790" y="504" font-size="9" fill="#8b96a8">· Story points por item de backlog</text>
    <text x="790" y="520" font-size="9" fill="#8b96a8">· Ideal para: features novas, projetos com</text>
    <text x="790" y="536" font-size="9" fill="#8b96a8">  escopo definido e equipe estável</text>
    <text x="790" y="556" font-size="9.5" fill="#3b82f6" font-weight="700">QUANDO USAR:</text>
    <text x="790" y="572" font-size="9" fill="#4b5563">Sprint 1: setup + infra + auth</text>
    <text x="790" y="588" font-size="9" fill="#4b5563">Sprint 2: CRUD principal</text>
    <text x="790" y="604" font-size="9" fill="#4b5563">Sprint 3: integrações + UX</text>
    <text x="790" y="620" font-size="9" fill="#4b5563">Sprint 4: segurança + launch</text>

    <!-- Kanban column -->
    <rect x="1264" y="402" width="500" height="240" rx="6" fill="#1a1000" stroke="#f59e0b" stroke-width="1"/>
    <text x="1514" y="422" font-size="9.5" fill="#f59e0b" font-weight="700" text-anchor="middle">KANBAN (operacional)</text>
    <text x="1272" y="440" font-size="9" fill="#8b96a8">· Fluxo contínuo sem sprints fixos</text>
    <text x="1272" y="456" font-size="9" fill="#8b96a8">· WIP limits por coluna (ex: máx 3 in-progress)</text>
    <text x="1272" y="472" font-size="9" fill="#8b96a8">· Cicle time como métrica principal</text>
    <text x="1272" y="488" font-size="9" fill="#8b96a8">· Pull system: pega item quando livre</text>
    <text x="1272" y="504" font-size="9" fill="#8b96a8">· Sem planning formal — prioridade no topo</text>
    <text x="1272" y="520" font-size="9" fill="#8b96a8">· Ideal para: bugs, suporte, manutenção</text>
    <text x="1272" y="536" font-size="9" fill="#8b96a8">  e operações contínuas pós-launch</text>
    <text x="1272" y="556" font-size="9.5" fill="#f59e0b" font-weight="700">QUANDO USAR:</text>
    <text x="1272" y="572" font-size="9" fill="#4b5563">Hotfixes urgentes em produção</text>
    <text x="1272" y="588" font-size="9" fill="#4b5563">Time de suporte / SRE on-call</text>
    <text x="1272" y="604" font-size="9" fill="#4b5563">Melhorias incrementais pós-MVP</text>
    <text x="1272" y="620" font-size="9" fill="#4b5563">Projetos exploratórios / research</text>
  </g>
