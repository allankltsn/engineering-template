    <path id="p5" d="M 1515,145 L 1620,145" fill="none"/>
  </defs>

  <rect width="1800" height="780" fill="#0b0f17"/>

  <!-- Header -->
  <rect x="20" y="16" width="1760" height="48" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <rect x="20" y="16" width="6" height="48" rx="3" fill="#3b82f6"/>
  <text x="44" y="37" font-size="15" font-weight="700" fill="#e6edf3">04 — Requisitos e Histórias de Usuário</text>
  <text x="44" y="55" font-size="11" fill="#8b96a8">story-agent → S-NNN · critério INVEST · BDD (Given/When/Then) · DoR 9 itens · DoD 12 itens</text>
  <text x="1760" y="37" font-size="9.5" fill="#4b5563" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">ETAPA 04/17</text>
  <text x="1760" y="52" font-size="9.5" fill="#3b82f6" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">story-agent</text>

  <!-- ══ FLOW: 5 nodes principais ══ -->

  <!-- NODE 1: Demanda -->
  <g opacity="0"><animate attributeName="opacity" to="1" begin="0.1s" dur="0.4s" fill="freeze"/>
    <rect x="30" y="100" width="185" height="90" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="122" y="121" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="middle">📋 Demanda</text>
    <text x="122" y="136" font-size="9.5" fill="#3b82f6" text-anchor="middle">do Brainstorm</text>
    <line x1="40" y1="143" x2="205" y2="143" stroke="#1f2937" stroke-width="1"/>
    <text x="40" y="157" font-size="9.5" fill="#8b96a8">síntese aprovada</text>
    <text x="40" y="171" font-size="9.5" fill="#8b96a8">pelo orchestrator</text>
    <text x="40" y="184" font-size="8.5" fill="#4b5563">epics + features</text>
  </g>

  <!-- Arrow 1→2 -->
  <line x1="215" y1="145" x2="300" y2="145" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-blue)" opacity="0.8"/>

  <!-- NODE 2: story-agent -->
  <g opacity="0"><animate attributeName="opacity" to="1" begin="0.3s" dur="0.4s" fill="freeze"/>
    <rect x="310" y="93" width="230" height="105" rx="8" fill="#111827" stroke="#2dd4bf" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="2.5s" repeatCount="indefinite"/>

    <line x1="320" y1="136" x2="530" y2="136" stroke="#1f2937" stroke-width="1"/>
    <text x="320" y="150" font-size="9.5" fill="#8b96a8">cria histórias de usuário</text>
    <text x="320" y="164" font-size="9.5" fill="#8b96a8">aplica INVEST em cada uma</text>
    <text x="320" y="178" font-size="9.5" fill="#8b96a8">gera critérios de aceite BDD</text>
    <text x="320" y="191" font-size="8.5" fill="#4b5563">tier: standard (Sonnet/medium)</text>
  </g>

  <!-- Arrow 2→3 -->
  <line x1="540" y1="145" x2="630" y2="145" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arr-teal)" opacity="0.8"/>

  <!-- NODE 3: User Story -->
  <g opacity="0"><animate attributeName="opacity" to="1" begin="0.5s" dur="0.4s" fill="freeze"/>
    <rect x="640" y="93" width="355" height="105" rx="8" fill="#111827" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="817" y="114" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="middle">📝 User Story S-NNN</text>
    <text x="817" y="129" font-size="9.5" fill="#2dd4bf" text-anchor="middle">estrutura obrigatória</text>
    <line x1="650" y1="136" x2="985" y2="136" stroke="#1f2937" stroke-width="1"/>
    <text x="650" y="150" font-size="9.5" fill="#8b96a8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Como &lt;persona&gt;,</text>
    <text x="650" y="164" font-size="9.5" fill="#8b96a8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">quero &lt;ação&gt;,</text>
    <text x="650" y="178" font-size="9.5" fill="#8b96a8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">para &lt;benefício&gt;.</text>
    <text x="820" y="150" font-size="9.5" fill="#f59e0b">prioridade: Must/Should/Could/Wont</text>
    <text x="820" y="164" font-size="9.5" fill="#8b96a8">estimativa: story points (Fibonacci)</text>
    <text x="820" y="178" font-size="9.5" fill="#4b5563">ID único incremental por sprint</text>
    <text x="650" y="190" font-size="8.5" fill="#4b5563">Ao menos 1 AC por história antes de entrar no DoR</text>
  </g>

  <!-- Arrow 3→4 -->
  <line x1="995" y1="145" x2="1175" y2="145" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arr-teal)" opacity="0.8"/>

  <!-- NODE 4: Critério BDD -->
  <g opacity="0"><animate attributeName="opacity" to="1" begin="0.7s" dur="0.4s" fill="freeze"/>
    <rect x="1185" y="93" width="335" height="105" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="1352" y="114" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="middle">🧪 Critério de Aceite BDD</text>
    <text x="1352" y="129" font-size="9.5" fill="#f59e0b" text-anchor="middle">Given / When / Then</text>
    <line x1="1195" y1="136" x2="1510" y2="136" stroke="#1f2937" stroke-width="1"/>
    <text x="1195" y="150" font-size="9.5" fill="#4ade80" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Given</text>
    <text x="1240" y="150" font-size="9.5" fill="#8b96a8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"> o usuário está autenticado</text>
    <text x="1195" y="164" font-size="9.5" fill="#3b82f6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">When</text>
    <text x="1240" y="164" font-size="9.5" fill="#8b96a8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"> clica em "Salvar"</text>
    <text x="1195" y="178" font-size="9.5" fill="#f59e0b" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Then</text>
    <text x="1240" y="178" font-size="9.5" fill="#8b96a8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"> os dados são persistidos</text>
    <text x="1195" y="191" font-size="8.5" fill="#4b5563">múltiplos ACs por história são permitidos</text>
  </g>

  <!-- Arrow 4→5 -->
  <line x1="1520" y1="145" x2="1605" y2="145" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-amber)" opacity="0.8"/>

  <circle r="3.5" fill="#2dd4bf">
    <animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion>

  </circle>
  <circle r="3.5" fill="#4ade80">

  <!-- ══ SEÇÃO: INVEST ══ -->
  <g opacity="0"><animate attributeName="opacity" to="1" begin="1.0s" dur="0.4s" fill="freeze"/>
    <rect x="20" y="218" width="860" height="175" rx="8" fill="#0d1117" stroke="#3b82f6" stroke-width="1"/>
    <text x="38" y="237" font-size="10" fill="#3b82f6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="1">CRITÉRIO INVEST — aplicado pelo story-agent em cada história</text>
    <line x1="30" y1="244" x2="870" y2="244" stroke="#1f2937" stroke-width="1"/>

    <!-- I -->
    <rect x="38" y="252" width="108" height="56" rx="5" fill="#111827" stroke="#3b82f6" stroke-width="1"/>
    <text x="92" y="270" font-size="18" font-weight="800" fill="#3b82f6" text-anchor="middle">I</text>
    <text x="92" y="284" font-size="9" fill="#e6edf3" text-anchor="middle">Independent</text>
    <text x="92" y="296" font-size="8.5" fill="#4b5563" text-anchor="middle">sem dependência</text>
    <text x="92" y="305" font-size="8.5" fill="#4b5563" text-anchor="middle">de outras histórias</text>

    <!-- N -->
    <rect x="158" y="252" width="108" height="56" rx="5" fill="#111827" stroke="#3b82f6" stroke-width="1"/>
    <text x="212" y="270" font-size="18" font-weight="800" fill="#3b82f6" text-anchor="middle">N</text>
    <text x="212" y="284" font-size="9" fill="#e6edf3" text-anchor="middle">Negotiable</text>
    <text x="212" y="296" font-size="8.5" fill="#4b5563" text-anchor="middle">detalhes abertos</text>
    <text x="212" y="305" font-size="8.5" fill="#4b5563" text-anchor="middle">à conversa</text>

    <!-- V -->
    <rect x="278" y="252" width="108" height="56" rx="5" fill="#111827" stroke="#3b82f6" stroke-width="1"/>
    <text x="332" y="270" font-size="18" font-weight="800" fill="#3b82f6" text-anchor="middle">V</text>
    <text x="332" y="284" font-size="9" fill="#e6edf3" text-anchor="middle">Valuable</text>
    <text x="332" y="296" font-size="8.5" fill="#4b5563" text-anchor="middle">entrega valor ao</text>
    <text x="332" y="305" font-size="8.5" fill="#4b5563" text-anchor="middle">usuário ou negócio</text>

    <!-- E -->
    <rect x="398" y="252" width="108" height="56" rx="5" fill="#111827" stroke="#3b82f6" stroke-width="1"/>
    <text x="452" y="270" font-size="18" font-weight="800" fill="#3b82f6" text-anchor="middle">E</text>
    <text x="452" y="284" font-size="9" fill="#e6edf3" text-anchor="middle">Estimable</text>
    <text x="452" y="296" font-size="8.5" fill="#4b5563" text-anchor="middle">pode ser estimada</text>
    <text x="452" y="305" font-size="8.5" fill="#4b5563" text-anchor="middle">em story points</text>

    <!-- S -->
    <rect x="518" y="252" width="108" height="56" rx="5" fill="#111827" stroke="#3b82f6" stroke-width="1"/>
    <text x="572" y="270" font-size="18" font-weight="800" fill="#3b82f6" text-anchor="middle">S</text>
    <text x="572" y="284" font-size="9" fill="#e6edf3" text-anchor="middle">Small</text>
    <text x="572" y="296" font-size="8.5" fill="#4b5563" text-anchor="middle">cabe em 1 sprint</text>
    <text x="572" y="305" font-size="8.5" fill="#4b5563" text-anchor="middle">(max 2 semanas)</text>

    <text x="692" y="270" font-size="18" font-weight="800" fill="#3b82f6" text-anchor="middle">T</text>
    <text x="692" y="284" font-size="9" fill="#e6edf3" text-anchor="middle">Testable</text>
    <text x="692" y="296" font-size="8.5" fill="#4b5563" text-anchor="middle">critério de aceite</text>
    <text x="692" y="305" font-size="8.5" fill="#4b5563" text-anchor="middle">verificável</text>

    <text x="38" y="378" font-size="10" fill="#4b5563">Se algum critério falhar → story-agent refina antes de seguir</text>
  </g>

  <!-- ══ SEÇÃO: DoR — Definition of Ready ══ -->
  <g opacity="0"><animate attributeName="opacity" to="1" begin="1.2s" dur="0.4s" fill="freeze"/>
    <rect x="896" y="218" width="440" height="300" rx="8" fill="#0d1117" stroke="#f59e0b" stroke-width="1"/>
    <text x="914" y="237" font-size="10" fill="#f59e0b" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="1">DoR — DEFINITION OF READY  ·  9 itens</text>
    <text x="914" y="250" font-size="9" fill="#4b5563">história só entra no sprint quando todos marcados ✓</text>
    <line x1="906" y1="256" x2="1326" y2="256" stroke="#1f2937" stroke-width="1"/>

    <text x="916" y="273" font-size="9.5" fill="#8b96a8">① ID único atribuído (S-NNN)</text>
    <text x="916" y="290" font-size="9.5" fill="#8b96a8">② User Story no formato padrão</text>
    <text x="916" y="307" font-size="9.5" fill="#8b96a8">③ Todos os critérios INVEST atendidos</text>
    <text x="916" y="324" font-size="9.5" fill="#8b96a8">④ Ao menos 1 critério de aceite (BDD)</text>
    <text x="916" y="341" font-size="9.5" fill="#8b96a8">⑤ Dependências mapeadas e resolvidas</text>
    <text x="916" y="358" font-size="9.5" fill="#8b96a8">⑥ Estimativa em story points</text>
    <text x="916" y="375" font-size="9.5" fill="#8b96a8">⑦ Mockup ou wireframe referenciado</text>
    <text x="916" y="392" font-size="9.5" fill="#8b96a8">⑧ Prioridade MoSCoW definida</text>
    <text x="916" y="409" font-size="9.5" fill="#8b96a8">⑨ Revisado pelo Product Owner (humano)</text>

    <rect x="906" y="420" width="420" height="84" rx="5" fill="#1a1200" stroke="#f59e0b" stroke-width="1"/>
    <text x="916" y="437" font-size="9" fill="#f59e0b" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">⚠ GATE obrigatório</text>
    <text x="916" y="453" font-size="9.5" fill="#8b96a8">O orchestrator bloqueia a execução se DoR ≠ 100%.</text>
    <text x="916" y="469" font-size="9.5" fill="#8b96a8">Story incompleta volta para story-agent refinar.</text>
    <text x="916" y="485" font-size="9.5" fill="#8b96a8">Nenhum agente de impl. recebe história sem DoR OK.</text>
    <text x="916" y="499" font-size="8.5" fill="#4b5563">Regra: "nunca implementar o que não está definido"</text>
  </g>

  <!-- ══ SEÇÃO: DoD — Definition of Done ══ -->
  <g opacity="0"><animate attributeName="opacity" to="1" begin="1.4s" dur="0.4s" fill="freeze"/>
    <rect x="1352" y="218" width="428" height="300" rx="8" fill="#0d1117" stroke="#4ade80" stroke-width="1"/>
    <text x="1370" y="237" font-size="10" fill="#4ade80" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="1">DoD — DEFINITION OF DONE  ·  12 itens</text>
    <text x="1370" y="250" font-size="9" fill="#4b5563">story só sai do sprint quando todos marcados ✓</text>
    <line x1="1362" y1="256" x2="1770" y2="256" stroke="#1f2937" stroke-width="1"/>

    <text x="1370" y="273" font-size="9.5" fill="#8b96a8">① Código implementado e revisado (4-eyes)</text>
    <text x="1370" y="290" font-size="9.5" fill="#8b96a8">② Testes unitários ≥ 80% cobertura</text>
    <text x="1370" y="307" font-size="9.5" fill="#8b96a8">③ Testes de integração passando</text>
    <text x="1370" y="324" font-size="9.5" fill="#8b96a8">④ Critérios de aceite BDD verificados</text>
    <text x="1370" y="341" font-size="9.5" fill="#8b96a8">⑤ Code review aprovado</text>
    <text x="1370" y="358" font-size="9.5" fill="#8b96a8">⑥ Sem warnings/erros de lint</text>
    <text x="1370" y="375" font-size="9.5" fill="#8b96a8">⑦ OWASP Top 10 verificado (security-agent)</text>
    <text x="1370" y="392" font-size="9.5" fill="#8b96a8">⑧ LGPD/GDPR verificado (privacy-agent)</text>
    <text x="1370" y="409" font-size="9.5" fill="#8b96a8">⑨ Documentação atualizada</text>
    <text x="1370" y="426" font-size="9.5" fill="#8b96a8">⑩ PR merged na branch principal</text>
    <text x="1370" y="443" font-size="9.5" fill="#8b96a8">⑪ CI/CD pipeline verde</text>
    <text x="1370" y="460" font-size="9.5" fill="#8b96a8">⑫ GitHub Issue fechada com evidências</text>

    <text x="1370" y="485" font-size="9" fill="#4b5563">Aprovação humana (lay-user) requerida para UX stories.</text>
    <text x="1370" y="499" font-size="9" fill="#4b5563">Score mínimo de 7/10 no teste com lay-user.</text>
    <text x="1370" y="513" font-size="9" fill="#4b5563">tech-review-agent valida ⑦ e ⑧ antes de merge.</text>
  </g>

  <!-- ══ SEÇÃO INFERIOR ══ -->

  <!-- Card: Hierarquia de requisitos -->
  <g opacity="0"><animate attributeName="opacity" to="1" begin="1.6s" dur="0.4s" fill="freeze"/>
    <rect x="20" y="408" width="430" height="165" rx="8" fill="#0d1117" stroke="#7c3aed" stroke-width="1"/>
    <text x="38" y="427" font-size="10" fill="#7c3aed" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="1">HIERARQUIA DE REQUISITOS</text>
    <line x1="30" y1="433" x2="440" y2="433" stroke="#1f2937" stroke-width="1"/>
    <!-- Visual hierarquia -->
