  <text x="44" y="55" font-size="11" fill="#8b96a8">deep · standard · light · 12 regras · 5 sinais de decisão · budget por wave · milestones de contexto</text>
  <text x="1760" y="37" font-size="9.5" fill="#4b5563" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">ETAPA 06/17</text>
  <text x="1760" y="52" font-size="9.5" fill="#f59e0b" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">orchestrator · todos agentes</text>

  <!-- ══ 3 TIER CARDS PRINCIPAIS ══ -->

  <!-- DEEP -->
  <g opacity="0"><animate attributeName="opacity" to="1" begin="0.1s" dur="0.4s" fill="freeze"/>

    <!-- Cost indicator -->

    <rect x="50" y="148" width="500" height="14" rx="3" fill="#111827"/>
    <rect x="50" y="148" width="500" height="14" rx="3" fill="#f59e0b" opacity="0.9"/>
    <text x="300" y="159" font-size="9" fill="#0b0f17" font-weight="700" text-anchor="middle">██████████████████████████████████ 100% (referência)</text>

    <line x1="30" y1="172" x2="570" y2="172" stroke="#1f2937" stroke-width="1"/>
    <text x="40" y="190" font-size="10" fill="#f59e0b" font-weight="600">Quando usar (5 sinais):</text>
    <text x="40" y="208" font-size="9.5" fill="#8b96a8">① Decisões de arquitetura que afetam múltiplos componentes</text>
    <text x="40" y="224" font-size="9.5" fill="#8b96a8">② Análise de segurança — OWASP, threat modeling, pentest virtual</text>
    <text x="40" y="240" font-size="9.5" fill="#8b96a8">③ Compliance legal — LGPD, GDPR, contratos, políticas de dados</text>
    <text x="40" y="256" font-size="9.5" fill="#8b96a8">④ Debugging de problema sem causa clara (mais de 2 tentativas)</text>
    <text x="40" y="272" font-size="9.5" fill="#8b96a8">⑤ Orquestração de wave complexa (muitas dependências)</text>
    <line x1="30" y1="280" x2="570" y2="280" stroke="#1f2937" stroke-width="1"/>
    <text x="40" y="295" font-size="9.5" fill="#4b5563">Agentes que sempre usam deep:</text>
    <text x="40" y="311" font-size="9.5" fill="#8b96a8">orchestrator · security-agent · owasp-agent · privacy-agent · lgpd-agent</text>
    <text x="40" y="327" font-size="9" fill="#4b5563">Regra: nunca usar para tarefas que standard resolve em ≤ 2 tentativas</text>
    <text x="40" y="341" font-size="9" fill="#f59e0b">Budget máx: 40% do custo total da wave</text>
  </g>

    <text x="640" y="327" font-size="9" fill="#4b5563">Regra: downgrade para light se tarefa for apenas formatação/lint</text>
    <text x="640" y="341" font-size="9" fill="#3b82f6">Budget máx: 50% do custo total da wave</text>

    <text x="1240" y="341" font-size="9" fill="#4ade80">Budget máx: 10% do custo total da wave</text>

  <!-- ══ 12 REGRAS DE ECONOMIA ══ -->
  <g opacity="0"><animate attributeName="opacity" to="1" begin="0.9s" dur="0.4s" fill="freeze"/>
    <rect x="896" y="368" width="884" height="270" rx="8" fill="#0d1117" stroke="#f59e0b" stroke-width="1"/>
    <text x="914" y="388" font-size="10" fill="#f59e0b" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="1">12 REGRAS DE ECONOMIA DE TOKENS</text>
    <line x1="906" y1="394" x2="1770" y2="394" stroke="#1f2937" stroke-width="1"/>

    <!-- Col A -->
    <text x="910" y="412" font-size="9.5" fill="#8b96a8">① Preferir light para formatação — não usar Opus em prettier</text>
    <text x="910" y="428" font-size="9.5" fill="#8b96a8">② Prompts concisos — nada de "seja extremamente detalhado"</text>
    <text x="910" y="444" font-size="9.5" fill="#8b96a8">③ Chunking de contexto — dividir docs longos em partes</text>
    <text x="910" y="460" font-size="9.5" fill="#8b96a8">④ Cache de contexto — reutilizar system prompt entre waves</text>
    <text x="910" y="476" font-size="9.5" fill="#8b96a8">⑤ Handoffs compactos — só o diff, não o arquivo inteiro</text>
    <text x="910" y="492" font-size="9.5" fill="#8b96a8">⑥ Não repetir contexto já passado no histórico</text>

    <!-- Col B -->
    <text x="1380" y="412" font-size="9.5" fill="#8b96a8">⑦ Saída estruturada — pedir JSON reduz tokens de resposta</text>
    <text x="1380" y="428" font-size="9.5" fill="#8b96a8">⑧ Limitar opções — "escolha entre A, B ou C" vs livre</text>
    <text x="1380" y="444" font-size="9.5" fill="#8b96a8">⑨ Revisão em batch — agrupar pequenos pedidos em um</text>
    <text x="1380" y="460" font-size="9.5" fill="#8b96a8">⑩ Stop sequences — finalizar cedo quando critério atingido</text>
    <text x="1380" y="476" font-size="9.5" fill="#8b96a8">⑪ Milestones de sessão — salvar live-state ao atingir</text>
    <text x="1380" y="492" font-size="9.5" fill="#f59e0b">⑫ Budget alert — parar ao atingir 90% do budget da wave</text>

    <text x="1220" y="557" font-size="9" fill="#8b96a8" text-anchor="middle">tokens</text>

    <text x="1220" y="584" font-size="8.5" fill="#4b5563" text-anchor="middle">resumo da sessão</text>

    <rect x="1330" y="525" width="200" height="65" rx="5" fill="#111827" stroke="#f59e0b" stroke-width="1"/>
    <text x="1430" y="543" font-size="13" font-weight="800" fill="#f59e0b" text-anchor="middle">300k</text>
    <text x="1430" y="557" font-size="9" fill="#8b96a8" text-anchor="middle">tokens</text>

  <g opacity="0"><animate attributeName="opacity" to="1" begin="1.1s" dur="0.4s" fill="freeze"/>
    <rect x="20" y="694" width="1760" height="104" rx="6" fill="#0d1117" stroke="#1f2937" stroke-width="1"/>
    <text x="38" y="714" font-size="9.5" fill="#4b5563" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">LEGENDA · CONCEITOS</text>
    <line x1="30" y1="719" x2="1770" y2="719" stroke="#1f2937" stroke-width="1"/>
