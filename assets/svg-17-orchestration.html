  <text x="1760" y="52" font-size="9.5" fill="#f59e0b" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">FINAL — ORQUESTRADOR</text>

    <text x="900" y="126" font-size="10" fill="#8b96a8" text-anchor="middle">orchestrator-agent — modelo DEEP (Opus / alta razão)</text>
    <line x1="660" y1="134" x2="1140" y2="134" stroke="#1f2937" stroke-width="1"/>
    <text x="900" y="150" font-size="9.5" fill="#f59e0b" font-weight="700" text-anchor="middle">NUNCA IMPLEMENTA — APENAS COORDENA</text>
    <text x="900" y="166" font-size="9" fill="#4b5563" text-anchor="middle">planeja · decompõe tarefas · faz dispatch · monitora · resolve conflitos · decide escalations</text>
    <text x="900" y="183" font-size="9" fill="#4b5563" text-anchor="middle">lê live-state.md ao iniciar · commita a cada 100k tokens · nunca escreve código de produção</text>
    <text x="900" y="200" font-size="9" fill="#4b5563" text-anchor="middle">mantém GitHub Projects atualizado · aprova DECISAO issues · ativa ALERTA_PERIGO se necessário</text>
  </g>

  <!-- ══ REGRA CARDINAL ══ -->
  <g opacity="0"><animate attributeName="opacity" to="1" begin="0.3s" dur="0.4s" fill="freeze"/>
    <rect x="20" y="82" width="600" height="130" rx="8" fill="#0d1117" stroke="#ef4444" stroke-width="1.5"/>
    <text x="320" y="106" font-size="11" font-weight="700" fill="#ef4444" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">⛔ REGRA CARDINAL</text>

    <text x="320" y="130" font-size="10" fill="#e6edf3" text-anchor="middle" font-weight="600">O orquestrador NUNCA implementa</text>
    <text x="320" y="148" font-size="9" fill="#4b5563" text-anchor="middle">Qualquer linha de código em produção vinda do orquestrador</text>
    <text x="320" y="164" font-size="9" fill="#4b5563" text-anchor="middle">é uma falha de design. Ele apenas decompõe, delega e valida.</text>
    <text x="320" y="182" font-size="9" fill="#ef4444" text-anchor="middle">Violação → parar sessão · registrar DECISAO issue · revisão humana</text>
    <text x="36" y="205" font-size="8.5" fill="#4b5563">Agente implementador ≠ agente revisor (4-eyes rule em todos os gates)</text>
  </g>

    <text x="1196" y="162" font-size="9" fill="#8b96a8">3. Worktree criado: feat/agent-S-NNN isolado</text>

    <text x="1196" y="210" font-size="9" fill="#f59e0b">6. Conflito entre agentes → orquestrador decide</text>
  </g>

  <!-- ══ FLOW COMPLETO DO SISTEMA ══ -->
  <g opacity="0"><animate attributeName="opacity" to="1" begin="1s" dur="0.4s" fill="freeze"/>
    <rect x="20" y="500" width="1760" height="190" rx="8" fill="#0d1117" stroke="#f59e0b" stroke-width="1"/>
    <text x="900" y="522" font-size="10" fill="#f59e0b" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">FLUXO COMPLETO — CICLO DE VIDA DE UMA TAREFA</text>
    <line x1="30" y1="528" x2="1770" y2="528" stroke="#1f2937" stroke-width="1"/>

    <!-- Etapas do fluxo -->
